<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F8F6F2" />
    <title>오프라인이에요 | ottline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8f6f2; color: #0f0f0f; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 36rem; padding: 32px; border: 1px solid #ecebe9; border-radius: 8px; background: #fff; }
      .brand { margin: 0 0 32px; color: #1e4d8c; font-size: 20px; font-weight: 700; }
      h1 { margin: 0; font-size: 24px; line-height: 1.4; }
      p { margin: 16px 0 24px; color: #4a4a4a; font-size: 16px; line-height: 1.7; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 12px 24px; border-radius: 8px; background: #f93; color: #0f0f0f; font-size: 16px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #0f0f0f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">ottline</div>
      <h1>지금은 오프라인이에요</h1>
      <p>인터넷 연결을 확인한 뒤 다시 열어주세요.</p>
      <a href="/">다시 열기</a>
    </main>
  </body>
</html>
