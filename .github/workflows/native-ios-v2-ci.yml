name: Native iOS v2 CI (SwiftUI)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ios-native/**"
      - ".github/workflows/native-ios-v2-ci.yml"
      - ".github/workflows/native-ios-v2-release.yml"
  push:
    branches:
      - main
      - "feature/ios-native-v2"
    paths:
      - "apps/ios-native/**"
      - ".github/workflows/native-ios-v2-ci.yml"
      - ".github/workflows/native-ios-v2-release.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iOS Native v2 project contract
        working-directory: apps/ios-native
        run: bash scripts/verify-ios-project.sh

      - name: Generate Xcode project via XcodeGen
        working-directory: apps/ios-native
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          bash scripts/verify-ios-project.sh

      - name: Build & Run XCTest Suite on iOS Simulator
        working-directory: apps/ios-native
        run: |
          xcodebuild -version
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, devs in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          candidates.sort(reverse=True)
          if not candidates:
              sys.exit(1)
          print(candidates[0][2])
          ')"
          echo "Using Simulator UDID: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcodebuild test \
            -project Ottline.xcodeproj \
            -scheme OttlineApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
