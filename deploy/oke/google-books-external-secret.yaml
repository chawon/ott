# Isolated from ott-api-secrets so a not-yet-provisioned Google key cannot
# interrupt synchronization of the existing database and provider credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ott-google-books-secrets
  namespace: ott
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: ott-google-books-secrets
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_BOOKS_API_KEY
      remoteRef:
        key: GOOGLE_BOOKS_API_KEY
