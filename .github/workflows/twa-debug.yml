name: Build TWA Debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/twa/**"
      - ".github/workflows/twa-debug.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Test watch reminder scan decisions
        run: python3 apps/twa/scripts/test-watch-reminder-worker.py

      - name: Run unit tests and build debug APK
        working-directory: apps/twa
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Rename APK
        run: mv apps/twa/app/build/outputs/apk/debug/app-debug.apk apps/twa/app/build/outputs/apk/debug/ottline-watch-reminder-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ottline-watch-reminder-debug-apk
          path: apps/twa/app/build/outputs/apk/debug/ottline-watch-reminder-debug.apk
