<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ottline</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <div class="wordmark" aria-label="ottline">
        <span class="wordmark-name">OTTLINE</span>
        <span class="wordmark-subtitle">ON THE TIMELINE</span>
      </div>
      <h1 class="title" data-i18n="popupTitle">Send this title to your log</h1>
      <p
        class="description"
        id="description"
        data-i18n="popupDescription"
      >
        We’ll read the title from a supported streaming page and prefill
        ottline QuickLog.
      </p>

      <section class="card" id="card" aria-live="polite">
        <p class="label" data-i18n="statusLabel">Current page</p>
        <p class="value" id="status" data-i18n="statusChecking">
          Checking this tab…
        </p>
      </section>

      <button
        class="cta"
        id="openButton"
        type="button"
        data-i18n="ctaOpen"
        disabled
      >
        Continue in ottline
      </button>
    </main>
    <script src="./popup-core.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
