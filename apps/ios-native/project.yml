name: Ottline
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OttlineApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OttlineApp
        excludes:
          - "Info.plist"
          - "OttlineApp.entitlements"
          - "Resources/Fonts/**"
      - path: Sources/OttlineApp/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ottline
        PRODUCT_NAME: OttlineApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/OttlineApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/OttlineApp/OttlineApp.entitlements
    dependencies:
      - target: OttlineWidgetExtension
        embed: true
      - sdk: libsqlite3.tbd

  OttlineWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OttlineWidget
        excludes:
          - "Info.plist"
          - "OttlineWidget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ottline.QuickLogWidget
        PRODUCT_NAME: OttlineWidgetExtension
        PRODUCT_BUNDLE_PACKAGE_TYPE: "XPC!"
        INFOPLIST_FILE: Sources/OttlineWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/OttlineWidget/OttlineWidget.entitlements
        SKIP_INSTALL: YES

  OttlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/OttlineTests
    dependencies:
      - target: OttlineApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ottline.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OttlineApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OttlineApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OttlineApp:
    build:
      targets:
        OttlineApp: all
        OttlineWidgetExtension: all
        OttlineTests: [test]
    test:
      targets:
        - OttlineTests
