# Keep the OpenAI key separate from database and existing provider secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ott-openai-secrets
  namespace: ott
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: ott-openai-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI_API_KEY
