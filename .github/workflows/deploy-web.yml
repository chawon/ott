name: Verify Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
      - '.vscode/settings.json'
  push:
    branches: ["main"]
    paths:
      - 'apps/web/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
      - '.vscode/settings.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript compiler and editor compatibility
        env:
          BACKEND_URL: http://127.0.0.1:8080
        run: npm run test:typescript-toolchain --workspace ott

      - name: Test analytics collection
        run: npm run test:analytics --workspace ott

      - name: Test administrator access boundary
        run: npm run test:admin-access --workspace ott

      - name: Test SEO contracts
        run: npm run test:seo --workspace ott

      - name: Test client recovery and service worker cache
        run: npm run test:client-recovery --workspace ott

      - name: Test report share cards
        run: npm run test:report-share --workspace ott

      - name: Build web
        env:
          BACKEND_URL: http://127.0.0.1:8080
        run: npm run build --workspace ott

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ott-web:verify

      - name: Install browser for locale verification
        run: npx playwright install --with-deps chromium

      - name: Verify web container runtime
        run: |
          docker run --detach --name ott-web-verify --publish 127.0.0.1:3000:3000 \
            --env BACKEND_URL=http://127.0.0.1:18081 \
            --env MCP_TEST_BACKEND_URL=http://127.0.0.1:18081 \
            --env CHATGPT_PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            --env CHATGPT_APP_SECRET=ottline-ci-mcp-test-only \
            ott-web:verify
          trap 'docker logs ott-web-verify; docker rm --force ott-web-verify' EXIT
          docker exec --interactive ott-web-verify node --input-type=module < apps/web/scripts/verify-web-runtime.mjs
          docker exec --interactive ott-web-verify node --input-type=module < apps/web/scripts/test-chatgpt-mcp.mjs
          npm run test:locale-navigation --workspace ott
          TIMELINE_TEST_URL=http://127.0.0.1:3000 npm run test:timeline-scroll --workspace ott
          WEB_STORAGE_PROFILE_DIR=/tmp/ott-web-storage-ci npm run test:web-storage --workspace ott -- --seed
          WEB_STORAGE_PROFILE_DIR=/tmp/ott-web-storage-ci npm run test:web-storage --workspace ott
