name: Native macOS v2 CI (SwiftUI)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/apple-core/**"
      - "apps/macos-native/**"
      - ".github/workflows/native-macos-v2-ci.yml"
  push:
    branches:
      - main
      - "feature/ios-native-v2"
    paths:
      - "apps/apple-core/**"
      - "apps/macos-native/**"
      - ".github/workflows/native-macos-v2-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify macOS Native v2 project contract
        working-directory: apps/macos-native
        run: bash scripts/verify-macos-project.sh

      - name: Generate Xcode project via XcodeGen
        working-directory: apps/macos-native
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          bash scripts/verify-macos-project.sh

      - name: Build & Run XCTest Suite on macOS
        working-directory: apps/macos-native
        run: |
          xcodebuild -version
          xcodebuild test \
            -project OttlineMac.xcodeproj \
            -scheme OttlineMacApp \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
