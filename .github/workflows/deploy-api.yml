name: Verify API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
  push:
    branches: ["main"]
    paths:
      - 'apps/api/**'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Docker for PostgreSQL tests
        run: docker info

      - name: Test API
        working-directory: apps/api
        run: ./gradlew test --no-daemon

      - name: Verify PostgreSQL tests executed
        working-directory: apps/api
        run: python3 scripts/verify-postgresql-tests.py

      - name: Build API
        working-directory: apps/api
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ott-api:verify

      - name: Verify API container runtime
        working-directory: apps/api
        env:
          API_RUNTIME_EXPECTED_VERSION: ${{ github.sha }}
        run: bash scripts/verify-container-runtime.sh
