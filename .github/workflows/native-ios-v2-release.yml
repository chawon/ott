name: Build & Deploy Native iOS v2 TestFlight IPA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing version (CFBundleShortVersionString, e.g. 2.0.0)"
        required: true
        default: "2.0.0"
        type: string
      build_number:
        description: "Build number (CFBundleVersion, must increase every upload, e.g. 25)"
        required: true
        default: "25"
        type: string
      submit_to_testflight:
        description: "Upload signed IPA to App Store Connect / TestFlight"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release-ipa:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version inputs
        run: |
          if ! [[ "${{ inputs.build_number }}" =~ ^[0-9]+$ ]]; then
            echo "build_number must be a positive integer."
            exit 1
          fi
          if [[ -z "${{ inputs.version_name }}" ]]; then
            echo "version_name must not be empty."
            exit 1
          fi

      - name: Verify iOS Native v2 project contract & generate Xcode project
        working-directory: apps/ios-native
        run: |
          bash scripts/verify-ios-project.sh
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Run Unit Tests on Simulator before archiving
        working-directory: apps/ios-native
        run: |
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin).get("devices", {})
          candidates = [
              (rt, d["name"], d["udid"])
              for rt, devs in data.items() if "iOS" in rt
              for d in devs if d.get("isAvailable") and "iPhone" in d.get("name", "")
          ]
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ')"
          xcodebuild test \
            -project Ottline.xcodeproj \
            -scheme OttlineApp \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Archive & Export Signed IPA (when signing secrets are present)
        if: ${{ env.IOS_DIST_CERT_BASE64 != '' && env.IOS_PROVISION_PROFILE_BASE64 != '' }}
        working-directory: apps/ios-native
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ottline-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          APP_PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE"
          APP_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i "$APP_PROFILE"))"
          APP_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< $(security cms -D -i "$APP_PROFILE"))"
          cp "$APP_PROFILE" "$PROFILES_DIR/$APP_UUID.mobileprovision"

          WIDGET_PROFILE_SPEC=""
          if [[ -n "$IOS_WIDGET_PROVISION_PROFILE_BASE64" ]]; then
            W_PROFILE="$RUNNER_TEMP/widget.mobileprovision"
            echo "$IOS_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode > "$W_PROFILE"
            W_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i "$W_PROFILE"))"
            W_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< $(security cms -D -i "$W_PROFILE"))"
            cp "$W_PROFILE" "$PROFILES_DIR/$W_UUID.mobileprovision"
            WIDGET_PROFILE_SPEC="<key>app.ottline.QuickLogWidget</key><string>$W_PROFILE_NAME</string>"
          fi

          xcodebuild archive \
            -project Ottline.xcodeproj \
            -scheme OttlineApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Ottline.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.ottline</key>
              <string>$APP_PROFILE_NAME</string>
              $WIDGET_PROFILE_SPEC
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ottline.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify Release Archive (Dry-Run when signing secrets are not yet configured)
        if: ${{ env.IOS_DIST_CERT_BASE64 == '' || env.IOS_PROVISION_PROFILE_BASE64 == '' }}
        working-directory: apps/ios-native
        run: |
          echo "Signing secrets not configured yet; running unsigned Release archive verification."
          xcodebuild archive \
            -project Ottline.xcodeproj \
            -scheme OttlineApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Ottline.xcarchive" \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload to TestFlight via App Store Connect API Key
        if: ${{ inputs.submit_to_testflight && env.IOS_DIST_CERT_BASE64 != '' && env.ASC_KEY_ID != '' }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_FILE="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
